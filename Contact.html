<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact - Tobias Lechner</title>

<style>
@font-face {
    font-family: 'Satoshi-Variable';
    src: url('Assets/Satoshi-Variable.ttf') format('truetype-variations'),
         url('Assets/Satoshi-Variable.ttf') format('truetype');
    font-weight: 300 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --font-heading: 4rem;
    --font-subtitle: calc(var(--font-heading) / 1.618);
    --font-body: calc(var(--font-subtitle) / 1.618);
}

html, body {
    font-family: 'Satoshi-Variable', sans-serif;
    min-height: 100%;
    margin: 0;
    background: white;
    color: black;
    cursor: url('Assets/Mouse/cursor_default.png') 16 16, auto;
    overscroll-behavior-x: contain;
}

a, button {
    cursor: url('Assets/Mouse/cursor_default.png') 16 16, pointer;
}

#backButton {
    position: fixed;
    top: 1vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 20px;
    border: none;
    background: transparent;
    cursor: url('Assets/Mouse/cursor_default.png') 16 16, pointer;
    z-index: 50;
}

#backButton img {
    max-height: 60px;
    width: auto;
}

.contact-container {
    position: absolute;
    top: 10vh;
    left: 10vh;
    max-width: 500px;
    z-index: 20;
    color: black;
    text-align: left;
}

.contact-container h1 {
    font-size: var(--font-heading);
    font-weight: 800;
    text-transform: uppercase;
    line-height: 0.9;
    margin: 0 0 2rem 0;
}

.contact-line {
    font-size: var(--font-body);
    font-weight: 300;
    line-height: 1.5;
    margin-bottom: 1.5rem;
}

.contact-line a {
    color: black;
    text-decoration: none;
}

.contact-line a:hover {
    color: rgb(255, 89, 0);
    cursor: url('Assets/Mouse/cursor_hover.png') 16 16, pointer;
}

.contact-stickers {
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    margin-top: 1rem;
}

.contact-stickers a {
    display: block;
    width: 130px;
    transition: transform 0.3s ease;
}

.contact-stickers a:hover {
    transform: scale(1.15);
    cursor: url('Assets/Mouse/cursor_hover.png') 16 16, pointer;
}

.hellosticker, .massagesticker {
    width: 100%;
    display: block;
}

.hellosticker img, .massagesticker img {
    width: 100%;
    height: auto;
    display: block;
}

@media screen and (max-width: 768px) {
    html, body {
        cursor: auto !important;
    }

    a, button {
        cursor: pointer;
    }

    .contact-container {
        position: relative;
        top: auto;
        left: auto;
        max-width: none;
        width: 90%;
        margin: 16vh auto 4rem;
        text-align: center;
    }

    .contact-stickers {
        justify-content: center;
    }
}
</style>
</head>
<body>

    <button id="backButton" onclick="window.location.href='index.html'">
        <img src="Assets/title_shrift.webp" alt="Zurück zur Startseite">
    </button>

    <div class="contact-container">
        <h1>Contact</h1>
        <div class="contact-line">Tobias Lechner<br>Ring 342,<br>8230 Hartberg</div>
        <div class="contact-line"><a href="mailto:zaxig.art@gmail.com">zaxig.art@gmail.com</a></div>
        <div class="contact-line"><a href="https://www.instagram.com/zaxig/">@zaxig</a></div>
        <div class="contact-stickers">
            <a href="mailto:zaxig.art@gmail.com">
                <div class="massagesticker" style="transform: rotate(-15deg);">
                    <img src="Assets/Massage.png" alt="Mail">
                </div>
            </a>
            <a href="https://www.instagram.com/zaxig/">
                <div class="hellosticker" style="transform: rotate(15deg);">
                    <img src="Assets/HelloSticker.png" alt="Instagram">
                </div>
            </a>
        </div>
    </div>

</body>
</html>

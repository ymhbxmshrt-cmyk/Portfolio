:root {
    --font-heading: 4rem;

}

html, body {

}

.scroll-container {
    display: flex;
    height: 100vh;

    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
}

.page {

    color: white;

}

.arrow-icon:hover {
    transform: translateY(-50%) scale(1.1);

:root {
    --gap: 3vh;
    --pad-top: 16vh;
    --pad-bottom: var(--gap);
    --col-unit: calc((100vw - 12 * var(--gap)) / 12);
    --row-unit: calc((100vh - var(--pad-top) - var(--pad-bottom) - 2 * var(--gap)) / 3);
    --row-unit: calc((100dvh - var(--pad-top) - var(--pad-bottom) - 2 * var(--gap)) / 3);
}

.seite2, .seite3 {
    position: relative;
    display: block;
    padding: 0;
}

.grid-item {
    background: #444;
    border: none;
    border-radius: 0.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    box-sizing: border-box;
    z-index: 10;
    position: absolute;
    opacity: 1;
    transition: none;
    overflow: hidden;
}

.grid-item:hover {
    background: #ffff;
    color:black;
}

.grid-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease-out;
}

.item-label {
    position: absolute;
    z-index: 20;
    font-size: 1.5rem;
    color: rgba(255, 255, 255, 0);
}

.grid-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0);
    transition: background 0.3s ease-in-out;
    z-index: 15;
}
.grid-item:hover .grid-image {
    transform: scale(1.1);
    transition: transform 0.4s ease-out;
}
.grid-item:hover .item-label {
    color: black;
    transition: color 0.3s ease;
}

#scrollContainer { position: relative; }

#backButton {
    position: fixed;
    top: 1vh;
    left: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 300px;
    height: 7vh;
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, 0);
    color: black;
    font-size: 1rem;
    font-weight: bold;
    line-height: normal;
    text-align: center;
    padding: 0;
    z-index: 50;
    transition: transform 0.4s ease-out, opacity 0.4s ease;
    transform: translate(-50%, -100%);
    opacity: 0;
    pointer-events: none;
}
#backButton.visible {
    transform: translate(-50%, 0);
    opacity: 1;
    pointer-events: auto;
}

.grid-item:hover, #backButton:hover {
    cursor: url('Assets/Mouse/cursor_hover.png') 16 16, pointer;
}
.grid-item:active, #backButton:active {
    cursor: url('Assets/Mouse/cursor_active.png') 16 16, pointer;
}
input[type="text"], textarea {
    cursor: url('Assets/Mouse/cursor_text.png') 16 16, text;
}

@media screen and (max-width: 768px) {
    :root {
        --mobile-vw-multiplier: 2;
        --mobile-width: calc(100vw * var(--mobile-vw-multiplier));
        --col-unit: calc((var(--mobile-width) - 12 * var(--gap)) / 12);
        --font-heading: 2.75rem;
    }

    html, body {
        cursor: auto !important;

    .page.seite1 {

    .header-text-container,

    .title-image2 {
        position: relative !important;

        bottom: auto !important;
        left: auto !important;
        right: auto !important;
        transform: none !important;

    }

    .header-text-container {
        width: 90%;

        text-align: center;
        order: 1;
    }
    .header-text-container h1 { font-size: var(--font-heading); }

    .title-image {

    }

    .title-image2 {
        order: 3;
        max-width: 90vw;
        max-height: 20vh;

    .nav-menu {
        position: relative;
        top: auto;
        right: auto;
        order: 4;
        flex-direction: row;
        justify-content: center;
        gap: 1.5rem;
        margin: 1vh 0 3vh;
    }
    .nav-menu-link {
        text-align: center;
    }

    .arrow-icon {
        position: fixed;
        top: 50%;
        right: 10px;
        left: auto;
        transform: translateY(-50%);
        width: 50px;
        z-index: 100;
        cursor: auto;
        opacity: 1;
    }
    .arrow-icon:hover {
        transform: translateY(-50%);
    }

    .page.seite2, .page.seite3 {
        width: var(--mobile-width);
        justify-content: flex-start;

        padding: var(--pad-top) var(--gap) var(--pad-bottom) var(--gap);

}

<script>
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
(function () {
  const container = document.getElementById('scrollContainer');
  const backButton = document.getElementById('backButton');
  const arrowIcon = document.querySelector('.arrow-icon');
  let scrollSpeedFactor = 2;
  const isMobile = () => window.matchMedia("(max-width: 768px)").matches;
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    let delta = e.deltaY || e.deltaX;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        delta = e.deltaX;
    }

    let scrollAmount = 0;
    if (Math.abs(delta) < 10) {
        scrollAmount = Math.sign(delta) * 5 * scrollSpeedFactor;
    } else {
        scrollAmount = delta * scrollSpeedFactor;
    }

    container.scrollBy({
        left: scrollAmount,
        behavior: 'auto'
    });
  }, { passive: false });
  container.addEventListener('scroll', () => {
    const pageWidth = window.innerWidth;
    const scrollPos = container.scrollLeft;
    let loopEndPos;
    let newScrollPos;
    if (isMobile()) {
        const mobilePageWidth = pageWidth * 2;
        loopEndPos = pageWidth + mobilePageWidth + mobilePageWidth;
        newScrollPos = pageWidth;
    } else {
        loopEndPos = 3 * pageWidth;
        newScrollPos = pageWidth;
    }

    const startOfPage1 = pageWidth;
    if (scrollPos > startOfPage1 * 0.5) {
        backButton.classList.add('visible');
        if (isMobile()) {
            arrowIcon.style.opacity = '0';
            arrowIcon.style.pointerEvents = 'none';
        }
    } else {
        backButton.classList.remove('visible');
        if (isMobile()) {
            arrowIcon.style.opacity = '1';
            arrowIcon.style.pointerEvents = 'auto';
        }
    }

    if (scrollPos >= loopEndPos) {
        const offsetIntoLoopEnd = scrollPos - loopEndPos;
        container.style.scrollBehavior = 'auto';
        container.scrollLeft = newScrollPos + offsetIntoLoopEnd;
        requestAnimationFrame(() => {
            container.style.scrollBehavior = 'smooth';
        });
    }
  });
  window.backToPage1 = function() {
    container.scrollTo({ left: 0, behavior: 'smooth' });
  }

  window.jumpToPage2 = function() {
    const pageWidth = window.innerWidth;
    container.scrollTo({ left: pageWidth, behavior: 'smooth' });
  }

  container.style.scrollBehavior = 'smooth';
})();
</script>

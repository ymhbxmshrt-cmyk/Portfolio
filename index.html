/* GRUNDEINSTELLUNGEN */
/* -------------------------------------- */
@font-face {

    src: url('Assets/AkzidenzGrotesk-Regular.otf') format('opentype');
    font-weight: normal; 
    font-style: normal;
}

html, body {
    font-family: 'AkzidenzGrotesk-Regular', sans-serif;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white; 
    /* Desktop Cursor */
    cursor: url('assets/Mouse/cursor_default.png') 16 16, auto; 
}

.scroll-container {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

.page {
    position: relative;

    justify-content: center;

.seite1 {

.title-image {

/* -------------------------------------- */
/* PFEIL (ARROW) */
/* -------------------------------------- */
.arrow-icon {
    position: absolute;
    top: 50%;
    right: 50px; /* Desktop: Rechts (oder left: 50px für links) - wie gewünscht */
    transform: translateY(-50%); 
    
    width: 60px; 
    height: auto;
    z-index: 40; 
    transition: transform 0.3s ease-in-out;
    cursor: url('assets/Mouse/cursor_default.png') 16 16, pointer;
    
    /* Damit er auf Desktop immer sichtbar bleibt, falls JS ihn ausblendet */
    opacity: 1 !important; 
    pointer-events: auto !important;
}

.arrow-icon:hover {
    transform: translateY(-50%) scale(1.1); 
    cursor: url('assets/Mouse/cursor_hover.png') 16 16, pointer; 
}

/* -------------------------------------- */
/* GRID LAYOUT SETUP */
/* -------------------------------------- */
:root {
    --gap: 3vh; 
    --pad-y: 9vh; 
    --col-unit: calc((100vw - 12 * var(--gap)) / 12); 
    --row-unit: calc((100vh - 2 * var(--pad-y) - 2 * var(--gap)) / 3);
}

.seite2, .seite3 {
    position: relative; 
    display: block; 
    padding: 0; 
}
 
.grid-item {
    background: #444; 
    border: none; 
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    box-sizing: border-box;
    z-index: 10;
    position: absolute; 
    opacity: 1; 
    transition: none;
    overflow: hidden;
}

.grid-item:hover {
    background: #ffff;
    color:black;    
}

.grid-image {
    width: 100%;       
    height: 100%;      
    object-fit: cover; 
    display: block;
}

.item-label {
    position: absolute; 
    z-index: 20;        
    font-size: 1.5rem;
    color: white;
}

/* Overlay Effekte */
.grid-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0); 
    transition: background 0.3s ease-in-out; 
    z-index: 15; 
}
.grid-item:hover .grid-image {
    transform: scale(1.1); 
    transition: transform 0.4s ease-out; 
}
.grid-item:hover .item-label {
    color: black;
    transition: color 0.3s ease;
}
.grid-image {
    transition: transform 0.4s ease-out;
}
.item-label {
    position: absolute; 
    z-index: 20; 
    color: rgba(255, 255, 255, 0); 
}

/* -------------------------------------- */
/* GRID POSITIONEN (SEITE 2 & 3) */
/* -------------------------------------- */
/* Seite 2 */
.s2-item-3 { left: calc(0 * var(--col-unit) + 1 * var(--gap)); top: var(--pad-y); width: calc(3 * var(--col-unit) + 2 * var(--gap)); height: var(--row-unit); } 
.s2-item-4 { left: calc(3 * var(--col-unit) + 4 * var(--gap)); top: var(--pad-y); width: calc(4 * var(--col-unit) + 1 * var(--gap)); height: var(--row-unit); background: #0077ff; z-index: 1; } 
.s2-item-5 { left: calc(9 * var(--col-unit) + 10 * var(--gap)); top: var(--pad-y); width: calc(3 * var(--col-unit) + 1 * var(--gap)); height: var(--row-unit); }
.s2-item-10 { left: calc(0 * var(--col-unit) + 1 * var(--gap)); top: calc(var(--pad-y) + 1 * var(--row-unit) + 1 * var(--gap)); width: calc(4 * var(--col-unit) + 2 * var(--gap)); height: var(--row-unit); } 
.s2-item-11 { left: calc(4 * var(--col-unit) + 4 * var(--gap)); top: calc(var(--pad-y) + 1 * var(--row-unit) + 1 * var(--gap)); width: calc(3 * var(--col-unit) + 1 * var(--gap)); height: var(--row-unit); }
.s2-item-6 { left: calc(9 * var(--col-unit) + 10 * var(--gap)); top: calc(var(--pad-y) + 1 * var(--row-unit) + 1 * var(--gap)); width: calc(3 * var(--col-unit) + 1 * var(--gap)); height: calc(2 * var(--row-unit) + 1 * var(--gap)); }
.s2-item-15 { left: calc(0 * var(--col-unit) + 1 * var(--gap)); top: calc(var(--pad-y) + 2 * var(--row-unit) + 2 * var(--gap)); width: calc(2 * var(--col-unit) + 1 * var(--gap)); height: var(--row-unit); } 
.s2-item-16 { left: calc(2 * var(--col-unit) + 3 * var(--gap)); top: calc(var(--pad-y) + 2 * var(--row-unit) + 2 * var(--gap)); width: calc(4 * var(--col-unit) + 0 * var(--gap)); height: var(--row-unit); } 
.s2-item-17 { left: calc(6 * var(--col-unit) + 4 * var(--gap)); top: calc(var(--pad-y) + 2 * var(--row-unit) + 2 * var(--gap)); width: calc(3 * var(--col-unit) + 5 * var(--gap)); height: var(--row-unit); } 
.s2-item-18 { left: calc(7 * var(--col-unit) + 6 * var(--gap)); top: var(--pad-y); width: calc(2 * var(--col-unit) + 3 * var(--gap)); height: calc(2 * var(--row-unit) + 1 * var(--gap)); } 
 
/* Seite 3 */

/* -------------------------------------- */
/* BUTTONS & UI */
/* -------------------------------------- */
#scrollContainer { position: relative; }

#backButton {
    position: fixed; 
    top: 1vh;
    left: 50%; 
    display: flex;
    justify-content: center; 
    align-items: center; 
    padding-top: 10px; 
    min-width: 300px; 
    height: 7vh;
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, 0); 
    color: black; 
    font-size: 1rem;
    font-weight: bold;
    line-height: normal; 
    text-align: center;
    padding: 0;
    z-index: 50; 
    transition: transform 0.4s ease-out, opacity 0.4s ease;
    transform: translate(-50%, -100%);
    opacity: 0;
}
#backButton.visible {
    transform: translate(-50%, 0); 
    opacity: 1;
}
/* Cursor Customization */
.grid-item:hover, #backButton:hover {
    cursor: url('assets/Mouse/cursor_hover.png') 16 16, pointer; 
}
.grid-item:active, #backButton:active {
    cursor: url('assets/Mouse/cursor_active.png') 16 16, pointer; 
}
input[type="text"], textarea {
    cursor: url('assets/Mouse/cursor_text.png') 16 16, text;
}

/* ************************************************* */
/* 📱 MOBILE OPTIMIERUNG (Max-Breite 768px) */
/* ************************************************* */
@media screen and (max-width: 768px) {
    
    /* --- Globale Mobile Variable --- */
    :root {
        --mobile-vw-multiplier: 2; /* Seite 2 und 3 sind doppelt so breit */
        --mobile-width: calc(100vw * var(--mobile-vw-multiplier)); 
        --col-unit: calc((var(--mobile-width) - 12 * var(--gap)) / 12); 
    }
    
    html, body {
        cursor: auto !important; /* Normaler Cursor auf Handy */
    }

    /* --- SEITE 1: FLEXBOX ZENTRIERUNG --- */
    /* Wir nutzen Flexbox, um ALLES automatisch untereinander zu zentrieren */
    .page.seite1 {
        flex-direction: column; 
        justify-content: center; /* Vertikal mittig im Viewport */
        align-items: center;     /* Horizontal mittig */
        padding: 5vh 5vw;        /* Etwas Abstand zum Rand */
        width: 100vw;
    }

    /* --- ELEMENTE AUF SEITE 1 RESETTEN --- */
    /* Wichtig: Absolute Positionierung entfernen, damit sie sich stapeln */
    .header-text-container, 
    .title-image, 
    .title-image2 {
        position: relative !important; 
        top: auto !important;
        left: auto !important;
        right: auto !important;
        transform: none !important; /* Keine Rotation, keine Verschiebung */
        margin: 2vh 0; /* Abstand zwischen den Elementen */
    }

    /* --- TEXT --- */
    .header-text-container {
        width: 90%;
        max-width: none;
        text-align: center;
        order: 1; /* Kommt als Erstes */
    }
    .header-text-container h1 { font-size: 3rem; }
    .header-text-container p { font-size: 1.2rem; }
    
    /* --- BILD 1 (CHARACTER) --- */
    .title-image {
        order: 2; /* Kommt als Zweites (Mitte) */
        max-width: 80vw;
        max-height: 40vh; /* Damit es nicht den ganzen Screen füllt */
    }

    /* --- BILD 2 (TITEL SCHRIFT) --- */
    .title-image2 {
        order: 3; /* Kommt als Drittes (Unten) */
        max-width: 90vw;
        max-height: 20vh; 
    }

    /* --- PFEIL FIXIERT (LINKS) --- */
    /* Der Pfeil bleibt absolut/fixiert, da er nicht mitscrollen soll */
    .arrow-icon {
        position: fixed; 
        top: 50%;
        right: 10px; /* Links am Rand */
        left: auto;
        transform: translateY(-50%);
        width: 50px;
        z-index: 100;
        cursor: auto;
        /* Wir überschreiben die Desktop-Eigenschaften */
        opacity: 1; /* Initial sichtbar */
    }
    .arrow-icon:hover { 
        transform: translateY(-50%);
    }

    /* --- SEITE 2 & 3 (Breiter machen) --- */
    .page.seite2, .page.seite3 {
        width: var(--mobile-width);
        justify-content: flex-start;
        align-items: flex-start;
        padding: var(--pad-y) var(--gap);
    }
    #progressBar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 6px; /* Dünne Linie */
            background-color: black;
            width: 0%; /* Startet bei 0 */
            z-index: 100;
            transition: width 0.1s linear; /* Weicher Übergang beim Scrollen */
        }
    .sticker1 {
            /* Positioniert die gesamte Galerie leicht rechts und zentriert auf der Seite */
            position: absolute;
            top: 30%;
            left: 10vh; 
            transform: translate(-50%, -50%);
            width: 20vw; /* Containerbreite */
            height: 10vh; /* Containerhöhe */
            max-width: 200px;
            max-height: 100px;
            /* Stellt sicher, dass die Bilder innerhalb des Containers frei positioniert werden können */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible; 
        }
}
</style>

<script>
(function () {
  const container = document.getElementById('scrollContainer');
  const backButton = document.getElementById('backButton');
  // NEU: Selektiert das Pfeil-Element
  const arrowIcon = document.querySelector('.arrow-icon');
  let scrollSpeedFactor = 2; 
  
  // Funktion zur Überprüfung, ob die mobile Ansicht aktiv ist
  const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

  // === 1. GLATTE SCROLL-LOGIK (Mausrad) ===
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    let delta = e.deltaY || e.deltaX;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        delta = e.deltaX;
    }
    
    let scrollAmount = 0;
    if (Math.abs(delta) < 10) { 
        scrollAmount = Math.sign(delta) * 5 * scrollSpeedFactor;
    } else {
        scrollAmount = delta * scrollSpeedFactor;
    }

    // Die Scroll-Blockade wurde entfernt, um ein reibungsloses Zurückscrollen
    // von Seite 2 zu Seite 1 zu ermöglichen.
    
    container.scrollBy({
        left: scrollAmount,
        behavior: 'auto' 
    });
    
  }, { passive: false });


  // === 2. SCROLL EVENTS (Sichtbarkeit & Loop) ===
  container.addEventListener('scroll', () => {
    const pageWidth = window.innerWidth;
    const scrollPos = container.scrollLeft;
    
    // --- Loop Berechnung ---
    let loopEndPos;
    let newScrollPos;
      
     
    
    if (isMobile()) {
        const mobilePageWidth = pageWidth * 2; // Entspricht --mobile-vw-multiplier: 2
        // Seite 1 (100vw) + Seite 2 (200vw) + Seite 3 (200vw) = 500vw Loop Ende
        loopEndPos = pageWidth + mobilePageWidth + mobilePageWidth;
        newScrollPos = pageWidth; 
    } else {
        // Desktop: Seite 1 (1x) + Seite 2 (1x) + Seite 3 (1x) = 3x (Kopie beginnt bei 3x)
        loopEndPos = 3 * pageWidth; 
        newScrollPos = pageWidth; // Der eigentliche Start der Inhalte (Seite 2)
    }

    // --- Button & Pfeil Sichtbarkeit ---
    const startOfPage1 = pageWidth;
    if (scrollPos > startOfPage1 * 0.5) { // Button anzeigen, sobald man die Hälfte von Seite 1 hinter sich hat
        backButton.classList.add('visible');
        
        // Handy: Pfeil verstecken, wenn man nicht auf Seite 1 ist
        if (isMobile()) {
            arrowIcon.style.opacity = '0';
            arrowIcon.style.pointerEvents = 'none';
        }
    } else {
        backButton.classList.remove('visible');
        
        // Handy: Pfeil wieder anzeigen auf Seite 1
        if (isMobile()) {
            arrowIcon.style.opacity = '1';
            arrowIcon.style.pointerEvents = 'auto';
        }
    }
    
    // --- ENDLOS-LOOP ---
    if (scrollPos >= loopEndPos) {
        const offsetIntoLoopEnd = scrollPos - loopEndPos;
        
        container.style.scrollBehavior = 'auto'; 
        container.scrollLeft = newScrollPos + offsetIntoLoopEnd;

        requestAnimationFrame(() => {
            container.style.scrollBehavior = 'smooth';
        }); 
    }
    
  });
  
  window.backToPage1 = function() {
    container.scrollTo({ left: 0, behavior: 'smooth' });
  }

  window.jumpToPage2 = function() {
    const pageWidth = window.innerWidth;
    container.scrollTo({ left: pageWidth, behavior: 'smooth' });
  }
  
  container.style.scrollBehavior = 'smooth';
})();
</script>
